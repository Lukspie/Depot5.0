[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "depotrack"
version = "0.1.0"
description = "Depot 5.0 – WMS pre prekládkové depo Budimír (hlavný backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "slowapi>=0.1.9,<1",
    "limits>=5,<6",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
    "pyjwt>=2.9,<3",
    "httpx>=0.27,<1",
    # phase 6 ML (ADR-057): the artifacts are pickled, training runs in this image with the same versions
    "scikit-learn==1.9.1",
    "joblib>=1.4,<2",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/depotrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
# Slovak texts legitimately use typographic characters (–, „“)
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
# no type information shipped
module = ["apscheduler.*", "sklearn.*", "joblib.*"]
ignore_missing_imports = true
