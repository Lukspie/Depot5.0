# Depot 5.0 (kód: depotrack) – presne 4 kontajnery: 2× databáza, 2× backend (Python, Node.js).
# Frontend je zostavený v multi-stage builde `app` a servíruje ho `app`.
name: depotrack

services:
  db-wms:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${WMS_DB_NAME:?nastav WMS_DB_NAME v .env}
      POSTGRES_USER: ${WMS_DB_USER:?nastav WMS_DB_USER v .env}
      POSTGRES_PASSWORD: ${WMS_DB_PASSWORD:?nastav WMS_DB_PASSWORD v .env}
    volumes:
      - wms-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${WMS_DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  db-telemetry:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${TELEMETRY_DB_NAME:?nastav TELEMETRY_DB_NAME v .env}
      POSTGRES_USER: ${TELEMETRY_DB_USER:?nastav TELEMETRY_DB_USER v .env}
      POSTGRES_PASSWORD: ${TELEMETRY_DB_PASSWORD:?nastav TELEMETRY_DB_PASSWORD v .env}
    volumes:
      - telemetry-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${TELEMETRY_DB_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  telematics:
    build:
      context: ./telematics
    environment:
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TELEMETRY_DB_HOST: db-telemetry
      TELEMETRY_DB_PORT: 5432
      TELEMETRY_DB_NAME: ${TELEMETRY_DB_NAME}
      TELEMETRY_DB_USER: ${TELEMETRY_DB_USER}
      TELEMETRY_DB_PASSWORD: ${TELEMETRY_DB_PASSWORD}
      ALLOWED_ORIGINS: ${TELEMATICS_ALLOWED_ORIGINS:-http://localhost:8000}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?nastav SERVICE_TOKEN v .env}
      WS_TICKET_SECRET: ${WS_TICKET_SECRET:?nastav WS_TICKET_SECRET v .env}
      APP_INTERNAL_URL: http://app:8000
      SIM_SPEED: ${SIM_SPEED:-60}
      SIM_START_DATE: ${SIM_START_DATE:-}
      SIM_START_TIME: ${SIM_START_TIME:-15:00}
      SIM_RANDOM_SEED: ${SIM_RANDOM_SEED:-42}
      SIM_FORCE_CASCADE: ${SIM_FORCE_CASCADE:-true}
      SIM_DEGRADED_DEVICE: ${SIM_DEGRADED_DEVICE:-DOCK-SCN-02}
      SIM_DEGRADATION_HOURS: ${SIM_DEGRADATION_HOURS:-6}
      SIM_EXTERNAL_DEVICES: ${SIM_EXTERNAL_DEVICES:-}
      SIM_CONTROLS_ENABLED: ${SIM_CONTROLS_ENABLED:-true}
      DEVICE_DEGRADED_THRESHOLD: ${DEVICE_DEGRADED_THRESHOLD:-0.92}
      GATE_RETENTION_DAYS: ${GATE_RETENTION_DAYS:-30}
    ports:
      - "${TELEMATICS_PORT:-8080}:8080"
    depends_on:
      db-telemetry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WMS_DB_HOST: db-wms
      WMS_DB_PORT: 5432
      WMS_DB_NAME: ${WMS_DB_NAME}
      WMS_DB_USER: ${WMS_DB_USER}
      WMS_DB_PASSWORD: ${WMS_DB_PASSWORD}
      TELEMATICS_INTERNAL_URL: http://telematics:8080
      TELEMATICS_PUBLIC_URL: ${TELEMATICS_PUBLIC_URL:-http://localhost:8080}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:8000,http://localhost:5173}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10/minute}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?nastav SEED_ADMIN_PASSWORD v .env}
      SEED_DISPATCHER_PASSWORD: ${SEED_DISPATCHER_PASSWORD:?nastav SEED_DISPATCHER_PASSWORD v .env}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:?nastav SEED_OPERATOR_PASSWORD v .env}
      SEED_SECURITY_PASSWORD: ${SEED_SECURITY_PASSWORD:?nastav SEED_SECURITY_PASSWORD v .env}
      SEED_COURIER_PASSWORD: ${SEED_COURIER_PASSWORD:?nastav SEED_COURIER_PASSWORD v .env}
      SEED_PARCELS_PER_DAY: ${SEED_PARCELS_PER_DAY:-1500}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?nastav SERVICE_TOKEN v .env}
      WS_TICKET_SECRET: ${WS_TICKET_SECRET:?nastav WS_TICKET_SECRET v .env}
      CASCADE_BUFFER_MIN: ${CASCADE_BUFFER_MIN:-30}
      BOARD_KEY: ${BOARD_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      TRACK_TOKEN_RATE_LIMIT: ${TRACK_TOKEN_RATE_LIMIT:-60/minute}
      TRACK_MISS_RATE_LIMIT: ${TRACK_MISS_RATE_LIMIT:-10/minute}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db-wms:
        condition: service_healthy
      telematics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      # first start runs migrations and the seed
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

volumes:
  wms-data:
  telemetry-data:
